name: Sync Encrypted Kiokun Note

on:
  issues:
    types: [opened]

jobs:
  sync:
    if: startsWith(github.event.issue.title, '[kiokun-sync]') && github.event.issue.user.login == 'Kimeiga'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Decrypt request and sync note to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 21f5b45e-ce53-4a63-b07b-dec1a0b44fcc
          ADMIN_EMAIL: hak7alp@gmail.com
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID, webcrypto } from 'node:crypto';

          for (const key of [
            'CLOUDFLARE_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'D1_DATABASE_ID',
            'ADMIN_EMAIL',
            'GITHUB_TOKEN',
            'GITHUB_REPOSITORY',
            'ISSUE_NUMBER',
            'ISSUE_BODY',
          ]) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }

          async function d1(sql, params = []) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}/query`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                  'content-type': 'application/json',
                },
                body: JSON.stringify({ sql, params }),
              },
            );
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(`D1 query failed with HTTP ${response.status}`);
            }
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result;
            if (result?.success === false) throw new Error('D1 query returned an unsuccessful result');
            return result?.results ?? [];
          }

          function fromBase64(value) {
            return Uint8Array.from(Buffer.from(value, 'base64'));
          }

          const envelope = JSON.parse(process.env.ISSUE_BODY);
          if (envelope?.v !== 1 || envelope?.alg !== 'RSA-OAEP-256+A256GCM') {
            throw new Error('Unsupported encrypted note envelope');
          }

          const configRows = await d1(
            'SELECT value FROM agent_bridge_config WHERE key = ? LIMIT 1',
            ['note_bridge_rsa_private_jwk'],
          );
          if (!configRows[0]?.value) throw new Error('Note bridge private key was not found');

          const privateKey = await webcrypto.subtle.importKey(
            'jwk',
            JSON.parse(configRows[0].value),
            { name: 'RSA-OAEP', hash: 'SHA-256' },
            false,
            ['decrypt'],
          );
          const rawAesKey = await webcrypto.subtle.decrypt(
            { name: 'RSA-OAEP' },
            privateKey,
            fromBase64(envelope.ek),
          );
          const aesKey = await webcrypto.subtle.importKey(
            'raw',
            rawAesKey,
            { name: 'AES-GCM' },
            false,
            ['decrypt'],
          );
          const plaintext = await webcrypto.subtle.decrypt(
            { name: 'AES-GCM', iv: fromBase64(envelope.iv) },
            aesKey,
            fromBase64(envelope.ct),
          );
          const note = JSON.parse(new TextDecoder().decode(plaintext));

          const character = typeof note.character === 'string' ? note.character.trim() : '';
          const noteText = typeof note.noteText === 'string' ? note.noteText.trim() : '';
          const isPublic = note.isPublic === true;
          if (!character || character.length > 128) throw new Error('Invalid character');
          if (!noteText || noteText.length > 50000) throw new Error('Invalid note text');

          const owners = await d1('SELECT id FROM user WHERE email = ? LIMIT 1', [process.env.ADMIN_EMAIL]);
          if (!owners[0]?.id) throw new Error('Kiokun owner account was not found');
          const userId = owners[0].id;

          const existingRows = await d1(
            'SELECT id, noteText FROM notes WHERE userId = ? AND character = ? LIMIT 1',
            [userId, character],
          );
          const existing = existingRows[0];
          const now = Math.floor(Date.now() / 1000);

          if (existing) {
            const current = String(existing.noteText ?? '').trim();
            const nextText = current && !current.includes(noteText) ? `${current}\n\n${noteText}` : (current || noteText);
            await d1(
              'UPDATE notes SET noteText = ?, isAdmin = 0, isPublic = ?, updatedAt = ? WHERE id = ?',
              [nextText, isPublic ? 1 : 0, now, existing.id],
            );
          } else {
            await d1(
              'INSERT INTO notes (id, userId, character, noteText, isAdmin, isPublic, createdAt, updatedAt) VALUES (?, ?, ?, ?, 0, ?, ?, ?)',
              [randomUUID(), userId, character, noteText, isPublic ? 1 : 0, now, now],
            );
          }

          const closeResponse = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.ISSUE_NUMBER}`,
            {
              method: 'PATCH',
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ state: 'closed' }),
            },
          );
          if (!closeResponse.ok) throw new Error(`Could not close trigger issue: HTTP ${closeResponse.status}`);

          console.log(`Synced private Kiokun note for ${character}.`);
          NODE

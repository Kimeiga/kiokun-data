name: Sync Encrypted Kiokun Note

on:
  issues:
    types: [opened]

jobs:
  sync:
    if: startsWith(github.event.issue.title, '[kiokun-sync]') && github.event.issue.user.login == 'Kimeiga'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Decrypt request and sync note to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 21f5b45e-ce53-4a63-b07b-dec1a0b44fcc
          ADMIN_EMAIL: hak7alp@gmail.com
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash, randomUUID, webcrypto } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import fs from 'node:fs/promises';

          for (const key of [
            'CLOUDFLARE_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'D1_DATABASE_ID',
            'ADMIN_EMAIL',
            'GITHUB_TOKEN',
            'GITHUB_REPOSITORY',
            'ISSUE_NUMBER',
            'ISSUE_BODY',
          ]) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }

          const apiBase = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}`;
          const cloudflareHeaders = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'content-type': 'application/json',
          };

          class D1QueryError extends Error {
            constructor(status, payload) {
              super(`D1 query failed with HTTP ${status}`);
              this.status = status;
              this.errors = payload?.errors ?? [];
            }
          }

          function isReadQuotaError(error) {
            return error instanceof D1QueryError && error.errors.some(
              (item) => item?.code === 7500 && String(item?.message ?? '').includes('row read limit'),
            );
          }

          async function d1(sql, params = []) {
            const response = await fetch(`${apiBase}/query`, {
              method: 'POST',
              headers: cloudflareHeaders,
              body: JSON.stringify({ sql, params }),
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) throw new D1QueryError(response.status, payload);
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result;
            if (result?.success === false) throw new Error('D1 query returned an unsuccessful result');
            return result?.results ?? [];
          }

          async function exportBridgeTables() {
            const endpoint = `${apiBase}/export`;
            async function call(body) {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: cloudflareHeaders,
                body: JSON.stringify(body),
              });
              const payload = await response.json();
              if (!response.ok || payload.success === false) {
                throw new Error(`D1 export failed with HTTP ${response.status}`);
              }
              return payload.result;
            }

            let state = await call({
              output_format: 'polling',
              dump_options: {
                no_schema: false,
                no_data: false,
                tables: ['agent_bridge_config', 'user', 'notes'],
              },
            });

            for (let attempt = 0; attempt < 60 && state?.status !== 'complete'; attempt += 1) {
              if (state?.status === 'error') throw new Error(`D1 export failed: ${state.error ?? 'unknown error'}`);
              if (!state?.at_bookmark) throw new Error('D1 export did not return a polling bookmark');
              await new Promise((resolve) => setTimeout(resolve, 500));
              state = await call({ output_format: 'polling', current_bookmark: state.at_bookmark });
            }

            if (state?.status !== 'complete' || !state?.result?.signed_url) {
              throw new Error('D1 export did not complete');
            }
            const download = await fetch(state.result.signed_url);
            if (!download.ok) throw new Error(`D1 export download failed with HTTP ${download.status}`);
            const path = '/tmp/kiokun-note-bridge.sql';
            await fs.writeFile(path, await download.text(), 'utf8');
            return path;
          }

          function extractIdentityFromExport(exportPath) {
            const python = String.raw`
import json, sqlite3, sys
sql_path, output_path, admin_email = sys.argv[1:4]
db = sqlite3.connect(':memory:')
with open(sql_path, encoding='utf-8') as f:
    db.executescript(f.read())
key_row = db.execute('SELECT value FROM agent_bridge_config WHERE "key" = ? LIMIT 1', ('note_bridge_rsa_private_jwk',)).fetchone()
owner_row = db.execute('SELECT id FROM user WHERE email = ? LIMIT 1', (admin_email,)).fetchone()
if not key_row or not owner_row:
    raise SystemExit('Required bridge identity data is missing')
with open(output_path, 'w', encoding='utf-8') as f:
    json.dump({'privateJwk': key_row[0], 'userId': owner_row[0]}, f)
`;
            const outputPath = '/tmp/kiokun-bridge-identity.json';
            const result = spawnSync('python3', ['-c', python, exportPath, outputPath, process.env.ADMIN_EMAIL], {
              encoding: 'utf8',
            });
            if (result.status !== 0) throw new Error('Could not extract bridge identity from D1 export');
            return outputPath;
          }

          function extractNoteFromExport(exportPath, userId, character) {
            const python = String.raw`
import json, sqlite3, sys
sql_path, output_path, user_id, character = sys.argv[1:5]
db = sqlite3.connect(':memory:')
with open(sql_path, encoding='utf-8') as f:
    db.executescript(f.read())
row = db.execute('SELECT id, noteText FROM notes WHERE userId = ? AND character = ? LIMIT 1', (user_id, character)).fetchone()
with open(output_path, 'w', encoding='utf-8') as f:
    json.dump(None if row is None else {'id': row[0], 'noteText': row[1]}, f)
`;
            const outputPath = '/tmp/kiokun-existing-note.json';
            const result = spawnSync('python3', ['-c', python, exportPath, outputPath, userId, character], {
              encoding: 'utf8',
            });
            if (result.status !== 0) throw new Error('Could not inspect existing note from D1 export');
            return outputPath;
          }

          async function importSql(sqlText) {
            const endpoint = `${apiBase}/import`;
            const etag = createHash('md5').update(sqlText).digest('hex');

            async function call(body) {
              const response = await fetch(endpoint, {
                method: 'POST',
                headers: cloudflareHeaders,
                body: JSON.stringify(body),
              });
              const payload = await response.json();
              if (!response.ok || payload.success === false) {
                throw new Error(`D1 import API failed with HTTP ${response.status}`);
              }
              return payload.result;
            }

            const init = await call({ action: 'init', etag });
            if (!init?.upload_url || !init?.filename) throw new Error('D1 import did not return an upload URL');

            const upload = await fetch(init.upload_url, { method: 'PUT', body: sqlText });
            if (!upload.ok) throw new Error(`D1 import upload failed with HTTP ${upload.status}`);
            const uploadedEtag = upload.headers.get('etag')?.replaceAll('"', '');
            if (uploadedEtag && uploadedEtag !== etag) throw new Error('D1 import upload checksum mismatch');

            let state = await call({ action: 'ingest', etag, filename: init.filename });
            for (let attempt = 0; attempt < 60 && state?.status !== 'complete'; attempt += 1) {
              if (state?.status === 'error') throw new Error(`D1 import failed: ${state.error ?? 'unknown error'}`);
              if (!state?.at_bookmark) throw new Error('D1 import did not return a polling bookmark');
              await new Promise((resolve) => setTimeout(resolve, 500));
              state = await call({ action: 'poll', current_bookmark: state.at_bookmark });
            }
            if (state?.status !== 'complete') throw new Error('D1 import did not complete');
          }

          function sqlString(value) {
            return `'${String(value).replaceAll("'", "''")}'`;
          }

          function fromBase64(value) {
            return Uint8Array.from(Buffer.from(value, 'base64'));
          }

          const envelope = JSON.parse(process.env.ISSUE_BODY);
          if (envelope?.v !== 1 || envelope?.alg !== 'RSA-OAEP-256+A256GCM') {
            throw new Error('Unsupported encrypted note envelope');
          }

          let privateJwk;
          let userId;
          let existing;
          let exportPath = null;
          let quotaFallback = false;

          try {
            const configRows = await d1(
              'SELECT value FROM agent_bridge_config WHERE "key" = ? LIMIT 1',
              ['note_bridge_rsa_private_jwk'],
            );
            if (!configRows[0]?.value) throw new Error('Note bridge private key was not found');
            privateJwk = JSON.parse(configRows[0].value);

            const owners = await d1('SELECT id FROM user WHERE email = ? LIMIT 1', [process.env.ADMIN_EMAIL]);
            if (!owners[0]?.id) throw new Error('Kiokun owner account was not found');
            userId = owners[0].id;
          } catch (error) {
            if (!isReadQuotaError(error)) throw error;
            quotaFallback = true;
            console.log('D1 row-read quota reached; using targeted export fallback.');
            exportPath = await exportBridgeTables();
            const identityPath = extractIdentityFromExport(exportPath);
            const identity = JSON.parse(await fs.readFile(identityPath, 'utf8'));
            privateJwk = JSON.parse(identity.privateJwk);
            userId = identity.userId;
          }

          const privateKey = await webcrypto.subtle.importKey(
            'jwk',
            privateJwk,
            { name: 'RSA-OAEP', hash: 'SHA-256' },
            false,
            ['decrypt'],
          );
          const rawAesKey = await webcrypto.subtle.decrypt(
            { name: 'RSA-OAEP' },
            privateKey,
            fromBase64(envelope.ek),
          );
          const aesKey = await webcrypto.subtle.importKey(
            'raw',
            rawAesKey,
            { name: 'AES-GCM' },
            false,
            ['decrypt'],
          );
          const plaintext = await webcrypto.subtle.decrypt(
            { name: 'AES-GCM', iv: fromBase64(envelope.iv) },
            aesKey,
            fromBase64(envelope.ct),
          );
          const note = JSON.parse(new TextDecoder().decode(plaintext));

          const character = typeof note.character === 'string' ? note.character.trim() : '';
          const noteText = typeof note.noteText === 'string' ? note.noteText.trim() : '';
          const isPublic = note.isPublic === true;
          if (!character || character.length > 128) throw new Error('Invalid character');
          if (!noteText || noteText.length > 50000) throw new Error('Invalid note text');

          if (quotaFallback) {
            const notePath = extractNoteFromExport(exportPath, userId, character);
            existing = JSON.parse(await fs.readFile(notePath, 'utf8'));
          } else {
            const existingRows = await d1(
              'SELECT id, noteText FROM notes WHERE userId = ? AND character = ? LIMIT 1',
              [userId, character],
            );
            existing = existingRows[0] ?? null;
          }

          const current = String(existing?.noteText ?? '').trim();
          const nextText = current && !current.includes(noteText) ? `${current}\n\n${noteText}` : (current || noteText);
          const now = Math.floor(Date.now() / 1000);
          const noteId = existing?.id ?? randomUUID();

          const writeSql = existing
            ? `UPDATE notes SET noteText = ${sqlString(nextText)}, isAdmin = 0, isPublic = ${isPublic ? 1 : 0}, updatedAt = ${now} WHERE id = ${sqlString(noteId)}`
            : `INSERT INTO notes (id, userId, character, noteText, isAdmin, isPublic, createdAt, updatedAt) VALUES (${sqlString(noteId)}, ${sqlString(userId)}, ${sqlString(character)}, ${sqlString(nextText)}, 0, ${isPublic ? 1 : 0}, ${now}, ${now})`;

          try {
            if (existing) {
              await d1(
                'UPDATE notes SET noteText = ?, isAdmin = 0, isPublic = ?, updatedAt = ? WHERE id = ?',
                [nextText, isPublic ? 1 : 0, now, noteId],
              );
            } else {
              await d1(
                'INSERT INTO notes (id, userId, character, noteText, isAdmin, isPublic, createdAt, updatedAt) VALUES (?, ?, ?, ?, 0, ?, ?, ?)',
                [noteId, userId, character, nextText, isPublic ? 1 : 0, now, now],
              );
            }
          } catch (error) {
            if (!isReadQuotaError(error)) throw error;
            console.log('D1 write requires a row read; using import fallback.');
            await importSql(`${writeSql};\n`);
          }

          const closeResponse = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.ISSUE_NUMBER}`,
            {
              method: 'PATCH',
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'content-type': 'application/json',
              },
              body: JSON.stringify({ state: 'closed' }),
            },
          );
          if (!closeResponse.ok) throw new Error(`Could not close trigger issue: HTTP ${closeResponse.status}`);

          console.log(`Synced private Kiokun note for ${character}.`);
          NODE

name: Sync Encrypted Kiokun Note

on:
  issues:
    types: [opened]

jobs:
  sync:
    if: startsWith(github.event.issue.title, '[kiokun-sync]') && github.event.issue.user.login == 'Kimeiga'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decrypt request and sync note to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 21f5b45e-ce53-4a63-b07b-dec1a0b44fcc
          ADMIN_EMAIL: hak7alp@gmail.com
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/sync-kiokun-note.mjs

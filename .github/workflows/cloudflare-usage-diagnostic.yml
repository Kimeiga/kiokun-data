name: Cloudflare Usage Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-usage-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Map Kiokun and Sehyo production scripts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ['CLOUDFLARE_API_TOKEN']
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          for name in ('kiokun', 'sehyo'):
              url = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{name}'
              req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  print(name, 'HTTP', error.code, error.read().decode('utf-8', 'replace')[:1000])
                  continue
              project = payload.get('result') or {}
              print(json.dumps({
                  'name': project.get('name'),
                  'id': project.get('id'),
                  'productionScriptName': project.get('production_script_name'),
                  'previewScriptName': project.get('preview_script_name'),
                  'usesFunctions': project.get('uses_functions'),
                  'domains': project.get('domains'),
                  'subdomain': project.get('subdomain'),
                  'failOpen': (project.get('deployment_configs') or {}).get('production', {}).get('fail_open'),
              }, sort_keys=True))
          PY

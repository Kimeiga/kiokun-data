name: Cloudflare Usage Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-usage-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Map Pages scripts to projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ['CLOUDFLARE_API_TOKEN']
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          url = f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects?per_page=100'
          req = urllib.request.Request(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          if payload.get('success') is not True:
              print(json.dumps(payload.get('errors'), indent=2))
              raise SystemExit(1)
          print('PAGES_PROJECTS')
          for project in payload.get('result') or []:
              latest = project.get('latest_deployment') or {}
              canonical = project.get('canonical_deployment') or {}
              print(json.dumps({
                  'name': project.get('name'),
                  'id': project.get('id'),
                  'productionScriptName': project.get('production_script_name'),
                  'previewScriptName': project.get('preview_script_name'),
                  'usesFunctions': project.get('uses_functions'),
                  'domains': project.get('domains'),
                  'subdomain': project.get('subdomain'),
                  'latestDeploymentUrl': latest.get('url'),
                  'canonicalDeploymentUrl': canonical.get('url'),
              }, sort_keys=True))
          PY

name: Cloudflare Usage Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-usage-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages Functions analytics schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          endpoint = 'https://api.cloudflare.com/client/v4/graphql'
          token = os.environ['CLOUDFLARE_API_TOKEN']

          def graphql(query):
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps({'query': query}).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          type_shape = 'kind name ofType { kind name ofType { kind name ofType { kind name } } }'
          payload = graphql(f'''query {{
            upper: __type(name: "Account") {{ fields {{ name args {{ name type {{ {type_shape} }} }} type {{ {type_shape} }} }} }}
            lower: __type(name: "account") {{ fields {{ name args {{ name type {{ {type_shape} }} }} type {{ {type_shape} }} }} }}
          }}''')
          if payload.get('errors'):
              print(json.dumps(payload['errors'], indent=2))
              raise SystemExit(1)

          account_type = payload.get('data', {}).get('upper') or payload.get('data', {}).get('lower')
          if not account_type:
              raise SystemExit('Could not resolve Cloudflare Account GraphQL type')
          target = next(field for field in account_type['fields'] if field['name'] == 'pagesFunctionsInvocationsAdaptiveGroups')
          print('PAGES_FIELD')
          print(json.dumps(target, indent=2))

          def named_type(t):
              while t and not t.get('name'):
                  t = t.get('ofType')
              return (t or {}).get('name')

          group_type = named_type(target['type'])
          print('GROUP_TYPE', group_type)
          detail = graphql(f'''query {{ __type(name: "{group_type}") {{ fields {{ name type {{ {type_shape} }} }} }} }}''')
          print('GROUP_FIELDS')
          print(json.dumps(detail, indent=2))
          for field in detail.get('data', {}).get('__type', {}).get('fields') or []:
              child = named_type(field['type'])
              if field['name'] in ('dimensions', 'sum', 'count', 'avg', 'max', 'min') and child:
                  child_detail = graphql(f'''query {{ __type(name: "{child}") {{ fields {{ name type {{ {type_shape} }} }} }} }}''')
                  print('CHILD_TYPE', field['name'], child)
                  print(json.dumps(child_detail, indent=2))
          PY

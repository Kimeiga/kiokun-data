name: Verify Kiokun 哀 Note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-kiokun-ai-note.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Verify owner note through targeted D1 export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 21f5b45e-ce53-4a63-b07b-dec1a0b44fcc
          ADMIN_EMAIL: hak7alp@gmail.com
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}/export`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'content-type': 'application/json',
          };

          async function call(body) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers,
              body: JSON.stringify(body),
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(`Export API failed with HTTP ${response.status}`);
            }
            return payload.result;
          }

          let state = await call({
            output_format: 'polling',
            dump_options: {
              no_schema: false,
              no_data: false,
              tables: ['user', 'notes'],
            },
          });

          for (let attempt = 0; attempt < 60 && state?.status !== 'complete'; attempt += 1) {
            if (state?.status === 'error') throw new Error(`D1 export failed: ${state.error ?? 'unknown error'}`);
            if (!state?.at_bookmark) throw new Error('D1 export did not return a polling bookmark');
            await new Promise((resolve) => setTimeout(resolve, 500));
            state = await call({ output_format: 'polling', current_bookmark: state.at_bookmark });
          }

          if (state?.status !== 'complete' || !state?.result?.signed_url) {
            throw new Error('D1 export did not complete');
          }
          const download = await fetch(state.result.signed_url);
          if (!download.ok) throw new Error(`Export download failed with HTTP ${download.status}`);
          await fs.writeFile('/tmp/kiokun-verify.sql', await download.text(), 'utf8');
          NODE

          python3 - <<'PY'
          import os, sqlite3
          from pathlib import Path

          db = sqlite3.connect(':memory:')
          db.executescript(Path('/tmp/kiokun-verify.sql').read_text(encoding='utf-8'))
          row = db.execute(
              '''SELECT n.noteText, n.isPublic, n.isAdmin
                 FROM notes n
                 JOIN user u ON u.id = n.userId
                 WHERE u.email = ? AND n.character = ?
                 LIMIT 1''',
              (os.environ['ADMIN_EMAIL'], '哀'),
          ).fetchone()

          exists = row is not None
          has_marker = bool(row and '可哀想（かわいそう）' in row[0])
          private = bool(row and row[1] == 0)
          non_admin = bool(row and row[2] == 0)

          print(f'owner_ai_note_exists={exists}')
          print(f'contains_expected_marker={has_marker}')
          print(f'is_private={private}')
          print(f'is_non_admin={non_admin}')

          if not (exists and has_marker and private and non_admin):
              raise SystemExit('Kiokun 哀 note verification failed')
          PY

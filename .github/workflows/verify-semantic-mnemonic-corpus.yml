name: Verify Semantic Mnemonic Corpus

on:
  pull_request:
    paths:
      - 'data/semantic_mnemonic_corpus/**'
      - 'scripts/manage_semantic_mnemonic_corpus.py'
      - 'scripts/repair_semantic_mnemonic_learning_glosses.py'
      - 'scripts/test_repair_semantic_mnemonic_learning_glosses.py'
      - 'scripts/repair_semantic_mnemonic_groupings.py'
      - 'scripts/repair_semantic_mnemonic_random_audit.py'
      - 'scripts/test_repair_semantic_mnemonic_groupings.py'
      - 'scripts/test_repair_semantic_mnemonic_random_audit.py'
      - 'scripts/semantic_mnemonic_card_inputs.json'
      - 'data/semantic_mnemonic_grouping_policy.json'
      - 'data/semantic_mnemonic_random_audit_policy.json'
      - 'sveltekit-app/static/game_data/component_glosses.json'
      - 'scripts/test_manage_semantic_mnemonic_corpus.py'
      - 'scripts/audit_semantic_mnemonic_component_families.py'
      - 'scripts/audit_semantic_mnemonics.py'
      - 'scripts/complete_semantic_mnemonics_all.py'
      - 'scripts/edit_semantic_mnemonic.py'
      - 'scripts/promote_gpt56_expedited_release.py'
      - 'scripts/smoke_semantic_mnemonic_deployment.py'
      - 'scripts/smoke_korean_word_deployment.py'
      - 'scripts/test_smoke_korean_word_deployment.py'
      - 'scripts/audit_word_page_coverage.py'
      - 'scripts/test_audit_word_page_coverage.py'
      - 'src/main.rs'
      - 'src/semantic_mnemonic_types.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/verify-semantic-mnemonic-corpus.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Verify canonical buckets and Python corpus API
        run: |
          python3 scripts/manage_semantic_mnemonic_corpus.py verify
          python3 scripts/repair_semantic_mnemonic_learning_glosses.py --check
          python3 scripts/repair_semantic_mnemonic_groupings.py --check
          python3 scripts/repair_semantic_mnemonic_random_audit.py --check
          python3 -m unittest scripts/test_manage_semantic_mnemonic_corpus.py
          python3 -m unittest scripts/test_repair_semantic_mnemonic_learning_glosses.py
          python3 -m unittest scripts/test_repair_semantic_mnemonic_groupings.py
          python3 -m unittest scripts/test_repair_semantic_mnemonic_random_audit.py
          python3 -m unittest scripts/test_audit_word_page_coverage.py
          python3 -m unittest scripts/test_smoke_korean_word_deployment.py

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test the Rust bucket loader
        run: |
          cargo test --bin build_dictionary \
            semantic_mnemonic_corpus_tests::loads_complete_bucketed_canonical_corpus \
            -- --exact
          cargo test --bin build_dictionary korean_content_tests

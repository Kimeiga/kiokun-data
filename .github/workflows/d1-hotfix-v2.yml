name: One-shot D1 row-exhaustion hotfix v2

on:
  push:
    branches: [fix/d1-row-exhaustion]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/d1-row-exhaustion

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply final hotfix
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/d1-hotfix.yml').read_text()
          patch = workflow.split("python3 <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(textwrap.dedent(patch), {'__name__': '__main__'})

          dictionary = Path('sveltekit-app/src/lib/server/dictionary-lookup.ts')
          text = dictionary.read_text()
          text = text.replace("""\nfunction fts5Phrase(value: string): string {\n\treturn `\"${value.replace(/\"/g, '\"\"')}\"`;\n}\n""", "")
          text = text.replace(
              """WHERE pronunciation MATCH ?\n\t\t\t  AND language = 'japanese'\n\t\t\t  AND pronunciation = ?""",
              """WHERE pronunciation MATCH ('\"' || replace(?1, '\"', '\"\"') || '\"')\n\t\t\t  AND language = 'japanese'\n\t\t\t  AND pronunciation = ?1""",
          )
          text = text.replace(
              "`).bind(fts5Phrase(normalized), normalized).all<JapaneseReadingRow>();",
              "`).bind(normalized).all<JapaneseReadingRow>();",
          )
          text = text.replace(
              """WHERE word MATCH ?\n\t\t\t  AND language = 'japanese'\n\t\t\t  AND word = ?""",
              """WHERE word MATCH ('\"' || replace(?1, '\"', '\"\"') || '\"')\n\t\t\t  AND language = 'japanese'\n\t\t\t  AND word = ?1""",
          )
          text = text.replace(
              "`).bind(fts5Phrase(word), word).all<JapaneseReadingRow>();",
              "`).bind(word).all<JapaneseReadingRow>();",
          )
          dictionary.write_text(text)

          reading = Path('sveltekit-app/src/routes/api/lookup-reading/+server.ts')
          text = reading.read_text()
          text = text.replace("""\nfunction fts5Phrase(value: string): string {\n\treturn `\"${value.replace(/\"/g, '\"\"')}\"`;\n}\n""", "")
          text = text.replace(
              """WHERE pronunciation MATCH ?\n\t\t\t\t  AND language = 'japanese'\n\t\t\t\t  AND pronunciation = ?""",
              """WHERE pronunciation MATCH ('\"' || replace(?1, '\"', '\"\"') || '\"')\n\t\t\t\t  AND language = 'japanese'\n\t\t\t\t  AND pronunciation = ?1""",
          )
          text = text.replace(
              ".bind(fts5Phrase(query.trim()), query.trim(), limit)",
              ".bind(query.trim(), limit)",
          )
          text = text.replace("LIMIT ?\n", "LIMIT ?2\n", 1)
          reading.write_text(text)

          Path('sveltekit-app/src/lib/server/d1-query-shape.test.ts').write_text("""import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';

const dictionaryLookup = readFileSync(new URL('./dictionary-lookup.ts', import.meta.url), 'utf8');
assert.match(dictionaryLookup, /WHERE pronunciation MATCH/);
assert.match(dictionaryLookup, /WHERE word MATCH/);
assert.doesNotMatch(dictionaryLookup, /WHERE language = 'japanese'\\s+AND pronunciation = \\?/);
assert.doesNotMatch(dictionaryLookup, /WHERE language = 'japanese'\\s+AND word = \\?/);

const searchApi = readFileSync(new URL('../../routes/api/search/+server.ts', import.meta.url), 'utf8');
assert.match(searchApi, /WHERE dictionary_search MATCH \\?/);
assert.doesNotMatch(searchApi, /WHERE \\(\\$\\{whereClause\\}\\)/);

const readingApi = readFileSync(new URL('../../routes/api/lookup-reading/+server.ts', import.meta.url), 'utf8');
assert.match(readingApi, /WHERE pronunciation MATCH/);

console.log('D1 dictionary hot paths use FTS MATCH before exact or prefix filtering.');
""")

          deploy = Path('.github/workflows/deploy-cloudflare-pages.yml')
          deploy_text = deploy.read_text()
          schema_step = """      - name: Apply sentence-learning database schema
        working-directory: sveltekit-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/apply-sentence-learning-schema.mjs
      
"""
          if schema_step not in deploy_text:
              raise SystemExit('expected per-deploy D1 schema step not found')
          deploy.write_text(deploy_text.replace(schema_step, '', 1))
          PY

      - name: Install dependencies
        working-directory: sveltekit-app
        run: npm ci --include=optional

      - name: Test
        working-directory: sveltekit-app
        run: npm test

      - name: Typecheck
        working-directory: sveltekit-app
        run: npm run check

      - name: Commit tested hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/d1-hotfix.yml .github/workflows/d1-hotfix-v2.yml .github/workflows/d1-hotfix-v3.yml
          git rm -f --ignore-unmatch .d1-hotfix-trigger
          git add .github/workflows/deploy-cloudflare-pages.yml sveltekit-app
          git commit -m 'Fix D1 dictionary query amplification'
          git push origin HEAD:fix/d1-row-exhaustion

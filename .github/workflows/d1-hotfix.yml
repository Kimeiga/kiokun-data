name: One-shot D1 row-exhaustion hotfix

on:
  push:
    branches: [fix/d1-row-exhaustion]

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/d1-row-exhaustion

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Patch D1 query amplification
        run: python3 .github/scripts/apply_d1_hotfix.py

      - name: Install dependencies
        working-directory: sveltekit-app
        run: npm ci --include=optional

      - name: Test
        working-directory: sveltekit-app
        run: npm test

      - name: Typecheck
        working-directory: sveltekit-app
        run: npm run check

      - name: Commit tested hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/d1-hotfix.yml .github/workflows/d1-hotfix-v2.yml .github/workflows/d1-hotfix-v3.yml
          git rm .github/scripts/apply_d1_hotfix.py
          git rm -f --ignore-unmatch .d1-hotfix-trigger
          git add .github/workflows/deploy-cloudflare-pages.yml sveltekit-app
          git commit -m 'Fix D1 dictionary query amplification'
          git push origin HEAD:fix/d1-row-exhaustion

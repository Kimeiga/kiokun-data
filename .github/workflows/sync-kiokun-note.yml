name: Sync Kiokun Note

on:
  issues:
    types: [opened]

jobs:
  sync:
    if: startsWith(github.event.issue.title, '[kiokun-note]') && github.event.issue.user.login == 'Kimeiga'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Lease pending note and sync to D1
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 21f5b45e-ce53-4a63-b07b-dec1a0b44fcc
          ADMIN_EMAIL: hak7alp@gmail.com
          VAL_BRIDGE_URL: https://kimeiga-kiokun-note-bridge.val.run
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';

          const required = [
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN',
            'ACTIONS_ID_TOKEN_REQUEST_URL',
            'CLOUDFLARE_API_TOKEN',
            'CLOUDFLARE_ACCOUNT_ID',
            'D1_DATABASE_ID',
            'ADMIN_EMAIL',
            'VAL_BRIDGE_URL',
            'GITHUB_TOKEN',
            'GITHUB_REPOSITORY',
            'ISSUE_NUMBER',
          ];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }

          async function getOidcToken() {
            const url = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
            url.searchParams.set('audience', 'kiokun-note-bridge');
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
            });
            const payload = await response.json();
            if (!response.ok || !payload.value) throw new Error('Could not obtain GitHub OIDC token');
            return payload.value;
          }

          async function callBridge(path, body) {
            const token = await getOidcToken();
            const response = await fetch(`${process.env.VAL_BRIDGE_URL}${path}`, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'content-type': 'application/json',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            return response;
          }

          async function d1(sql, params = []) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}/query`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                  'content-type': 'application/json',
                },
                body: JSON.stringify({ sql, params }),
              },
            );
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(`D1 query failed with HTTP ${response.status}`);
            }
            const result = Array.isArray(payload.result) ? payload.result[0] : payload.result;
            if (result?.success === false) throw new Error('D1 query returned an unsuccessful result');
            return result?.results ?? [];
          }

          async function closeIssue() {
            const response = await fetch(
              `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${process.env.ISSUE_NUMBER}`,
              {
                method: 'PATCH',
                headers: {
                  Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                  Accept: 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                },
                body: JSON.stringify({ state: 'closed' }),
              },
            );
            if (!response.ok) throw new Error(`Could not close trigger issue: HTTP ${response.status}`);
          }

          let leasedId = null;
          try {
            const nextResponse = await callBridge('/next');
            if (nextResponse.status === 204) {
              console.log('No pending Kiokun note requests.');
              await closeIssue();
              process.exit(0);
            }
            if (!nextResponse.ok) throw new Error(`Val bridge lease failed with HTTP ${nextResponse.status}`);

            const note = await nextResponse.json();
            leasedId = note.id;
            if (!note.id || !note.character || !note.noteText) throw new Error('Val bridge returned an invalid note request');

            const owners = await d1('SELECT id FROM user WHERE email = ? LIMIT 1', [process.env.ADMIN_EMAIL]);
            if (!owners[0]?.id) throw new Error('Kiokun owner account was not found');
            const userId = owners[0].id;

            const existingRows = await d1(
              'SELECT id, noteText FROM notes WHERE userId = ? AND character = ? LIMIT 1',
              [userId, note.character],
            );
            const existing = existingRows[0];
            const now = Math.floor(Date.now() / 1000);

            if (existing) {
              const current = String(existing.noteText ?? '').trim();
              const incoming = String(note.noteText).trim();
              const nextText = current && !current.includes(incoming) ? `${current}\n\n${incoming}` : (current || incoming);
              await d1(
                'UPDATE notes SET noteText = ?, isAdmin = 0, isPublic = ?, updatedAt = ? WHERE id = ?',
                [nextText, note.isPublic === true ? 1 : 0, now, existing.id],
              );
            } else {
              await d1(
                'INSERT INTO notes (id, userId, character, noteText, isAdmin, isPublic, createdAt, updatedAt) VALUES (?, ?, ?, ?, 0, ?, ?, ?)',
                [randomUUID(), userId, note.character, String(note.noteText).trim(), note.isPublic === true ? 1 : 0, now, now],
              );
            }

            const completeResponse = await callBridge('/complete', { id: note.id, response: 'synced to Kiokun D1' });
            if (!completeResponse.ok) throw new Error(`Could not mark Val request complete: HTTP ${completeResponse.status}`);

            console.log(`Synced Kiokun note request ${note.id}.`);
            await closeIssue();
          } catch (error) {
            if (leasedId) {
              try {
                await callBridge('/fail', { id: leasedId, response: error instanceof Error ? error.message : String(error) });
              } catch {}
            }
            throw error;
          }
          NODE

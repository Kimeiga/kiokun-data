name: Diagnose Kiokun Note Bridge D1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-note-bridge-d1.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check D1 read queries without printing secret values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 21f5b45e-ce53-4a63-b07b-dec1a0b44fcc
        run: |
          node --input-type=module <<'NODE'
          for (const key of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'D1_DATABASE_ID']) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }

          async function probe(name, sql, params = []) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}/query`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                  'content-type': 'application/json',
                },
                body: JSON.stringify({ sql, params }),
              },
            );
            let payload;
            try {
              payload = await response.json();
            } catch {
              payload = null;
            }
            const first = Array.isArray(payload?.result) ? payload.result[0] : payload?.result;
            console.log(JSON.stringify({
              name,
              httpStatus: response.status,
              topLevelSuccess: payload?.success ?? null,
              resultSuccess: first?.success ?? null,
              rowCount: Array.isArray(first?.results) ? first.results.length : null,
              errors: payload?.errors ?? [],
              messages: payload?.messages ?? [],
            }));
          }

          await probe('select-one', 'SELECT 1 AS ok');
          await probe('bridge-count', 'SELECT COUNT(*) AS count FROM agent_bridge_config');
          await probe(
            'bridge-private-key-by-name',
            'SELECT value FROM agent_bridge_config WHERE "key" = ? LIMIT 1',
            ['note_bridge_rsa_private_jwk'],
          );
          await probe('owner-by-email', 'SELECT id FROM user WHERE email = ? LIMIT 1', ['hak7alp@gmail.com']);
          NODE

name: Setup Kiokun Note Bridge Key

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-note-bridge-key.yml'
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate bridge key and store private key in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 21f5b45e-ce53-4a63-b07b-dec1a0b44fcc
        run: |
          node --input-type=module <<'NODE'
          import { webcrypto } from 'node:crypto';

          for (const key of ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'D1_DATABASE_ID']) {
            if (!process.env[key]) throw new Error(`${key} is missing`);
          }

          async function d1(sql, params = []) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}/query`,
              {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                  'content-type': 'application/json',
                },
                body: JSON.stringify({ sql, params }),
              },
            );
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(`D1 query failed with HTTP ${response.status}`);
            }
            return payload;
          }

          const pair = await webcrypto.subtle.generateKey(
            {
              name: 'RSA-OAEP',
              modulusLength: 2048,
              publicExponent: new Uint8Array([1, 0, 1]),
              hash: 'SHA-256',
            },
            true,
            ['encrypt', 'decrypt'],
          );
          const publicJwk = await webcrypto.subtle.exportKey('jwk', pair.publicKey);
          const privateJwk = await webcrypto.subtle.exportKey('jwk', pair.privateKey);
          const now = Math.floor(Date.now() / 1000);

          await d1(
            'CREATE TABLE IF NOT EXISTS agent_bridge_config (key TEXT PRIMARY KEY, value TEXT NOT NULL, updatedAt INTEGER NOT NULL)',
          );
          await d1(
            `INSERT INTO agent_bridge_config (key, value, updatedAt) VALUES (?, ?, ?)
             ON CONFLICT(key) DO UPDATE SET value=excluded.value, updatedAt=excluded.updatedAt`,
            ['note_bridge_rsa_private_jwk', JSON.stringify(privateJwk), now],
          );

          console.log(`KIOKUN_NOTE_BRIDGE_PUBLIC_JWK=${JSON.stringify(publicJwk)}`);
          NODE

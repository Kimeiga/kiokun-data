name: Deploy to Cloudflare Pages

# Cloudflare's built-in Git deployments are disabled for this project.
# Keep this workflow as the single production build and deployment path.
on:
  push:
    branches: [main]
    paths:
      - 'sveltekit-app/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    permissions:
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      
      - name: Install dependencies
        working-directory: sveltekit-app
        run: npm ci --include=optional

      - name: Test
        working-directory: sveltekit-app
        run: npm test

      - name: Check
        working-directory: sveltekit-app
        run: npm run check

      - name: Generate frequency list
        run: python3 scripts/generate_frequency_list.py

      - name: Generate compact featured video index
        working-directory: sveltekit-app
        run: node scripts/generate-featured-reels.mjs

      - name: Build
        working-directory: sveltekit-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run build

      - name: Prune source-only assets from Pages output
        working-directory: sveltekit-app
        run: node scripts/prune-cloudflare-output.js

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --cwd=sveltekit-app --project-name=kiokun --branch=main --commit-dirty=true --skip-caching

      - name: Verify deployed assets and critical routes
        working-directory: sveltekit-app
        run: node scripts/verify-pages-deployment.mjs "${{ steps.deploy.outputs.deployment-url }}"

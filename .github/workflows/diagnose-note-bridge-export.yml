name: Diagnose Kiokun Note Bridge Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-note-bridge-export.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Export only bridge tables and inspect locally
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: 21f5b45e-ce53-4a63-b07b-dec1a0b44fcc
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';

          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/d1/database/${process.env.D1_DATABASE_ID}/export`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'content-type': 'application/json',
          };

          async function call(body) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers,
              body: JSON.stringify(body),
            });
            const payload = await response.json();
            if (!response.ok || payload.success === false) {
              throw new Error(`Export API failed: HTTP ${response.status}: ${JSON.stringify(payload.errors ?? [])}`);
            }
            return payload.result;
          }

          let state = await call({
            output_format: 'polling',
            dump_options: {
              no_schema: false,
              no_data: false,
              tables: ['agent_bridge_config', 'user', 'notes'],
            },
          });

          for (let attempt = 0; attempt < 30 && state?.status !== 'complete'; attempt += 1) {
            if (state?.status === 'error') throw new Error(`D1 export failed: ${state.error ?? 'unknown error'}`);
            if (!state?.at_bookmark) throw new Error('D1 export did not return a polling bookmark');
            await new Promise((resolve) => setTimeout(resolve, 500));
            state = await call({ output_format: 'polling', current_bookmark: state.at_bookmark });
          }

          if (state?.status !== 'complete' || !state?.result?.signed_url) {
            throw new Error('D1 export did not complete');
          }

          const download = await fetch(state.result.signed_url);
          if (!download.ok) throw new Error(`Export download failed: HTTP ${download.status}`);
          await fs.writeFile('/tmp/kiokun-bridge-export.sql', await download.text(), 'utf8');
          console.log('Targeted D1 export completed.');
          NODE

          python3 - <<'PY'
          import sqlite3
          from pathlib import Path

          sql = Path('/tmp/kiokun-bridge-export.sql').read_text(encoding='utf-8')
          db = sqlite3.connect(':memory:')
          db.executescript(sql)

          key_count = db.execute(
              'SELECT COUNT(*) FROM agent_bridge_config WHERE "key" = ?',
              ('note_bridge_rsa_private_jwk',),
          ).fetchone()[0]
          owner_count = db.execute(
              'SELECT COUNT(*) FROM user WHERE email = ?',
              ('hak7alp@gmail.com',),
          ).fetchone()[0]
          note_count = db.execute(
              'SELECT COUNT(*) FROM notes WHERE character = ?',
              ('哀',),
          ).fetchone()[0]

          print(f'bridge_key_present={key_count == 1}')
          print(f'owner_present={owner_count == 1}')
          print(f'ai_note_rows={note_count}')
          PY

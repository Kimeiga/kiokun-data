name: Deploy Kiokun Note Writer

on:
  push:
    branches: [main]
    paths:
      - 'sveltekit-app/src/worker/kiokun-note-writer.ts'
      - 'sveltekit-app/wrangler.note-writer.toml'
      - '.github/workflows/deploy-note-writer.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy note writer Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config sveltekit-app/wrangler.note-writer.toml
